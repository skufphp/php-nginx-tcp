services:
  # PHP-FPM
  php-nginx-tcp:
    build:
      context: ./docker
      dockerfile: php.Dockerfile
    container_name: php-nginx-tcp
    restart: unless-stopped
    volumes:
      - ./public:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/local.ini:ro
    networks:
      - php-nginx-tcp-network
    healthcheck:
      test: [ "CMD", "cgi-fcgi", "-bind", "-connect", "localhost:9000" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Веб-сервер Nginx
  nginx-tcp:
    image: nginx:alpine
    container_name: nginx-tcp
    restart: unless-stopped
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./public:/var/www/html
      - ./docker/nginx/conf.d/app.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - php-nginx-tcp-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      php-nginx-tcp:
        condition: service_healthy

  # База данных MySQL
  mysql-nginx-tcp:
    image: mysql:8.4
    container_name: mysql-nginx-tcp
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - php-nginx-tcp-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    # phpMyAdmin
  phpmyadmin-nginx-tcp:
    image: phpmyadmin
    container_name: phpmyadmin-nginx-tcp
    restart: unless-stopped
    environment:
      PMA_HOST: ${PMA_HOST}
    ports:
      - "${PHPMYADMIN_PORT}:80"
    networks:
      - php-nginx-tcp-network
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "-", "http://localhost/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      mysql-nginx-tcp:
        condition: service_healthy

volumes:
  mysql-data:

networks:
  php-nginx-tcp-network:
    driver: bridge
