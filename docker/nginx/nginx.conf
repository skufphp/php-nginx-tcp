# ==============================================================================
# КОНФИГУРАЦИЯ: КЛАССИЧЕСКИЙ PHP (ГИБРИДНАЯ)
# Подходит для: Проектов с множеством PHP-файлов и простой структурой.
# Особенности:
#   - Проверяет физическое наличие .php файла перед проксированием (безопасно).
#   - Если файл не найден, передает управление в index.php (через try_files).
#   - Оптимален как "Золотой стандарт" для большинства простых проектов.
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        root         /var/www/html;
        index        index.html index.php index.htm;

        # Основная директория
        location / {
            # Если запрос — это не существующий файл или папка,
            # перенаправляем всё на index.php
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Передаем PHP-файлы в PHP-FPM
        location ~ \.php$ {
            # Проверяем, существует ли файл, прежде чем проксировать запрос
            if (!-f $request_filename) {
                return 404;
            }

            fastcgi_pass   php-nginx-tcp:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        # Скрытие директории .git, .env и других чувствительных файлов
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
