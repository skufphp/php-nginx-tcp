# ==============================================================================
# КОНФИГУРАЦИЯ NGINX (Virtual Host)
# Реализация паттерна Single Entry Point (Единая точка входа)
# ==============================================================================

server {
    listen       80;                        # Слушаем HTTP на порту 80
    server_name  localhost;                 # Имя хоста
    root   /var/www/html;                   # Корень сайта (DocumentRoot)
    index  index.php;                       # Файл-индекс по умолчанию

    server_tokens off;            # Безопасность: скрываем версию Nginx
    client_max_body_size 64M;     # Лимит на размер загружаемых файлов

    # Логирование (вывод в stdout/stderr для Docker)
    error_log  /dev/stderr info;
    access_log /dev/stdout;

    # Запрет доступа к скрытым файлам (например, .git или .env)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Основной роутинг: если файл не найден, передаем запрос на index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Обработка PHP-файлов
    location ~ \.php$ {
        # Защита: если .php файла нет на диске — отдаем 404
        try_files $fastcgi_script_name =404;

        # Настройка FastCGI (взаимодействие с PHP-FPM)
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   php-nginx-tcp:9000;    # Подключение через TCP:9000
        fastcgi_index index.php;

        # Стандартные параметры FastCGI
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Оптимизация буферов для стабильной работы под нагрузкой
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Таймауты (чтобы долгие скрипты не обрывались сразу или не вешали сервер)
        fastcgi_connect_timeout 5s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 30s;

        # Скрываем заголовок X-Powered-By (безопасность)
        fastcgi_hide_header X-Powered-By;
    }
}
