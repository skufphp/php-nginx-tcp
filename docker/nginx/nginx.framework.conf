# ==============================================================================
# КОНФИГУРАЦИЯ: FRAMEWORK (SINGLE ENTRY POINT)
# Подходит для: Laravel, Symfony, Slim или самописных роутеров.
# Особенности:
#   - Максимальная производительность (минимум проверок файловой системы).
#   - Весь трафик, которого нет на диске, агрессивно уходит на index.php.
#   - FastCGI работает без дополнительных условий, так как роутинг на PHP.
#   - Идеален для Production сред с высокой нагрузкой.
# ==============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;
        root         /var/www/html;
        index        index.html index.php index.htm;

        # Основная директория (Single Entry Point)
        location / {
            # Если запрос — это НЕ существующий файл или директория
            # ПЕРЕНАПРАВЛЯЕМ всё на index.php
            try_files $uri $uri/ /index.php$is_args$args;
        }

        # Передаем ВСЕ PHP-файлы в PHP-FPM напрямую (максимально быстро).
        location ~ \.php$ {
            fastcgi_pass   php-nginx-tcp:9000;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include        fastcgi_params;
        }

        # Скрытие директории .git, .env и других чувствительных файлов
        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
